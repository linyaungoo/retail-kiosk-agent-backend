# Non-secret configuration for Cloud Run (gcloud run deploy --env-vars-file ...).
# Secrets (OPENAI_API_KEY, KIOSK_API_KEYS, ADMIN_API_KEY) come from Secret Manager
# via --set-secrets; never put them here. All values must be quoted strings.

APP_ENV: "production"
LOG_LEVEL: "INFO"
LOG_TRANSCRIPTS: "false"

# Flutter must send X-Kiosk-Key (one of the keys in the kiosk-api-keys secret).
KIOSK_AUTH_ENABLED: "true"

# Business data: Google Sheets via the service's own identity (no key file).
BUSINESS_DATA_SOURCE: "google_sheets"
GOOGLE_SHEETS_ID: "1ZlT2XlIpzJ02BOsUBUNwHNWtvuEweoTHjjElFnIa9aw"
GOOGLE_SERVICE_ACCOUNT_FILE: ""
CACHE_TTL_SECONDS: "300"

# Speech-to-text / assistant / text-to-speech (benchmarked 2026-10-06).
STT_PROVIDER: "openai"
OPENAI_STT_MODEL: "gpt-4o-transcribe"
OPENAI_AGENT_MODEL: "gpt-5.4-mini"
OPENAI_AGENT_REASONING_EFFORT: "none"
AGENT_TEMPLATE_ANSWERS: "true"
TTS_PROVIDER: "openai"
OPENAI_TTS_MODEL: "gpt-4o-mini-tts"
OPENAI_TTS_VOICE: "coral"
OPENAI_TTS_FORMAT: "mp3"
TTS_CACHE_ENTRIES: "300"

# Keep the OpenAI connection warm between customers. Requires an always-allocated
# CPU (--no-cpu-throttling); harmless otherwise.
OPENAI_KEEPWARM_INTERVAL_SECONDS: "60"
OPENAI_AGENTS_TRACING: "false"
